<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fb; }
        .chat-shell { max-width: 800px; margin: 40px auto; }
        .messages { height: 440px; overflow-y: auto; background: #fff; border: 1px solid #dee2e6; border-radius: 12px; padding: 16px; }
        .message { max-width: 75%; padding: 10px 13px; border-radius: 12px; margin-bottom: 12px; background: #e9ecef; }
        .message.mine { margin-left: auto; background: #0d6efd; color: #fff; }
        .message small { display: block; opacity: .75; margin-top: 5px; }
    </style>
</head>
<body>
    <main class="chat-shell px-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div><h3 class="mb-0">Doctor–Patient Chat</h3><small id="appointmentLabel"></small></div>
            <button class="btn btn-outline-secondary" onclick="goBack()">Back</button>
        </div>
        <div id="chatError" class="alert alert-danger d-none"></div>
        <div id="messages" class="messages"><p class="text-muted">Loading messages...</p></div>
        <form id="messageForm" class="mt-3 d-flex gap-2">
            <input id="messageInput" class="form-control" maxlength="1000" autocomplete="off" placeholder="Type a message..." required>
            <button class="btn btn-primary" type="submit">Send</button>
        </form>
        <p class="text-muted small mt-2">Messages refresh automatically every 5 seconds.</p>
    </main>
    <script src="js/chat.js"></script>
</body>
</html>
